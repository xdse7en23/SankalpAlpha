<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SankalpAlpha Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        /* Centered Premium Vertical Container */
        .app-container {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px; /* Locked to perfect centered screenshot width */
            text-align: center;
            box-sizing: border-box;
        }

        h2 { color: #000000; margin-top: 0; margin-bottom: 5px; font-size: 26px; font-weight: 700; }
        .subtitle { color: #666; margin: 0 0 25px 0; font-size: 14px; font-weight: 500; }
        
        /* Total Completed Top Row */
        .total-completed-row {
            background-color: #1a1a1a;
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: 0.3px;
        }

        /* Large Premium Counter Box */
        .counter-box {
            background: linear-gradient(135deg, #2e7d32, #4caf50);
            color: white;
            padding: 35px 20px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(76,175,80,0.25);
        }
        .counter-box h1 { margin: 0; font-size: 5rem; font-weight: 700; line-height: 1; }
        .counter-box p { margin: 10px 0 0 0; font-size: 15px; font-weight: 500; opacity: 0.9; }
        
        h3 { color: #222; font-size: 18px; font-weight: 700; margin-bottom: 20px; text-align: left; padding-left: 2px; }
        
        /* Clean 30-Day Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
            margin-bottom: 35px;
            background: #ffffff;
            padding: 5px 0;
        }
        
        /* Premium Circular Day Dots */
        .day-dot {
            aspect-ratio: 1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            user-select: none;
        }
        .day-dot:active { transform: scale(0.9); }
        
        /* Precise Screenshot Color Tokens */
        .day-dot.upcoming { background-color: #212121; color: #ffffff; } 
        .day-dot.pavitra { background-color: #66bb6a; color: white; box-shadow: 0 2px 6px rgba(102,187,106,0.3); } 
        .day-dot.broken { background-color: #ef5350; color: white; box-shadow: 0 2px 6px rgba(239,83,80,0.3); } 
        
        /* Large Pill-Shaped Reset Button */
        .btn-reset {
            background-color: #ef5350;
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            box-shadow: 0 6px 20px rgba(239,83,80,0.3);
            transition: background-color 0.2s;
        }
        .btn-reset:active { transform: scale(0.99); background-color: #e53935; }
        
        .tip-text { font-size: 11px; color: #999; margin-top: 25px; line-height: 1.5; text-align: center; }
    </style>
</head>
<body>

    <!-- Target Screenshot UI Layout Locked -->
    <div class="app-container">
        <h2>SankalpAlpha Tracker</h2>
        <p class="subtitle">Aapka Sankalp, Aapki Shakti 💪</p>

        <div class="total-completed-row" id="total-days-display">
            Total Completed: 0 Days
        </div>

        <div class="counter-box">
            <h1 id="streak-count">0</h1>
            <p>Sful Din (Current Streak)</p>
        </div>

        <h3>Last 30 Days Chart</h3>
        <div class="grid-container" id="calendar-grid"></div>

        <button class="btn-reset" onclick="markRelapse()">🔴 Nightfall / Relapse (Reset)</button>
        
        <p class="tip-text">Tip: Kisi bhi date par direct click karke bhi aap uska status badal sakte hain. Pavitra din green dikhenge aur bache hue black.</p>
    </div>

<script>
    const totalDays = 30;
    
    // Core state array matching the UI behavior perfectly
    let defaultTracker = Array(totalDays).fill('upcoming');
    let trackerData = JSON.parse(localStorage.getItem('alphaTrackerUIOnly')) || defaultTracker;

    function renderGrid() {
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';
        let currentStreak = 0;
        let tempStreak = 0;
        let totalCompletedCount = 0;

        trackerData.forEach((status, index) => {
            const dot = document.createElement('div');
            dot.classList.add('day-dot');
            dot.innerText = index + 1;

            if (status === 'pavitra') {
                dot.classList.add('pavitra');
                totalCompletedCount++; 
            } else if (status === 'broken') {
                dot.classList.add('broken');
            } else {
                dot.classList.add('upcoming');
            }

            // Click handling cycling mechanism
            dot.onclick = () => {
                if (trackerData[index] === 'upcoming') {
                    trackerData[index] = 'pavitra';
                } else if (trackerData[index] === 'pavitra') {
                    trackerData[index] = 'broken';
                } else {
                    trackerData[index] = 'upcoming';
                }
                saveAndRefresh();
            };

            grid.appendChild(dot);
        });

        // Exact streak evaluation chain rules
        for (let i = 0; i < trackerData.length; i++) {
            if (trackerData[i] === 'pavitra') {
                tempStreak++;
                currentStreak = tempStreak;
            } else if (trackerData[i] === 'broken') {
                tempStreak = 0;
            }
        }
        
        document.getElementById('streak-count').innerText = currentStreak;
        document.getElementById('total-days-display').innerText = `Total Completed: ${totalCompletedCount} Days`;
    }

    function markRelapse() {
        const today = new Date().getDate();
        if(today <= totalDays) {
            trackerData[today - 1] = 'broken';
            saveAndRefresh();
        }
    }

    function saveAndRefresh() {
        localStorage.setItem('alphaTrackerUIOnly', JSON.stringify(trackerData));
        renderGrid();
    }

    renderGrid();
</script>

</body>
</html>
